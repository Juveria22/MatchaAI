<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./config.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<title>matchai</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'16'%20fill%3D'%234FB227'%2F%3E%3Cpath%20d%3D'M54%2030.5A22 22 0 0 1 30 52.9a24 24 0 0 1-8.7-1.6L9 56l4.8-13A21.5 21.5 0 0 1 10.6 30.5 22 22 0 0 1 32 8.5a22 22 0 0 1 22 22z'%20fill%3D'none'%20stroke%3D'%23F1F6EA'%20stroke-width%3D'5'%20stroke-linejoin%3D'round'%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{--m-bg:#F8F4ED;--m-bg2:#F1E9DD;--m-card:#FFFDFA;--m-ink:#2B3527;--m-soft:#616D57;--m-accent:#5D7F45;--m-deep:#4C6B3C;--m-line:#E5DCCC;--m-blush:#C99298}
html{scroll-behavior:smooth}
body{margin:0;background:var(--m-bg)}
a{color:var(--m-accent);text-decoration:none}a:hover{color:var(--m-ink)}
</style>
</helmet>
<div style="position:relative;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-family:'Jost',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--m-ink)">
  <div style="position:fixed;inset:0;z-index:0;pointer-events:none">
    <img src="uploads/IMG_5105.JPG" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;opacity:.5;filter:saturate(.85)">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, color-mix(in srgb, var(--m-bg) 62%, transparent) 0%, color-mix(in srgb, var(--m-bg) 85%, transparent) 55%, color-mix(in srgb, var(--m-bg) 95%, transparent) 100%)"></div>
  </div>
  <nav style="position:fixed;top:0;left:50%;transform:translate(-50%,0);z-index:500;display:flex;align-items:center;justify-content:center;gap:26px;padding:13px 34px 14px;background:color-mix(in srgb, var(--m-bg) 88%, transparent);backdrop-filter:blur(16px);border:1px solid var(--m-line);border-top:none;border-radius:0 0 999px 999px;box-shadow:0 14px 34px -22px rgba(0,0,0,.4);max-width:calc(100vw - 24px)">
    <a href="index.html" style="display:flex;align-items:center;gap:9px;font-family:'Parisienne',cursive;font-weight:400;font-size:30px;color:var(--m-ink)">
      matchai
    </a>
    <div style="display:flex;align-items:center;gap:22px;margin-left:auto;font-size:14px;font-weight:500">
      <a href="index.html" style="color:var(--m-ink)" style-hover="color:var(--m-accent)">Home</a>
      <a href="matchai.html" style="color:var(--m-ink);border-bottom:2px solid var(--m-accent);padding-bottom:2px">matchai</a>
      <a href="play.html" style="color:var(--m-ink)" style-hover="color:var(--m-accent)">Play</a>
      <a href="resources.html" style="color:var(--m-ink)" style-hover="color:var(--m-accent)">Resources</a>
    </div>
      <button onClick="{{ toggleTheme }}" aria-label="Switch light or dark mode" title="Switch light or dark mode" style="margin-left:18px;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--m-line);background:transparent;border-radius:999px;color:var(--m-ink);font-size:14px;line-height:1;cursor:pointer" style-hover="border-color:var(--m-accent);color:var(--m-accent)">{{ themeIcon }}</button>

  </nav>

  <section style="padding-top:64px;position:relative;z-index:1;flex:1;display:grid;grid-template-rows:1fr;grid-template-columns:100%;width:100%;min-height:0;overflow:hidden">
    <dc-import name="ChatWidget" mode="inline" flush="{{ true }}" hint-size="100%,100%"></dc-import>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Linen&quot;,&quot;Dark Matcha&quot;],&quot;default&quot;:&quot;Linen&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  themeName() {
    try { const s = localStorage.getItem('matchai-theme'); if (s) return s; } catch (e) {}
    return this.props.palette ?? 'Linen';
  }
  toggleTheme() {
    const next = this.themeName() === 'Linen' ? 'Dark Matcha' : 'Linen';
    try { localStorage.setItem('matchai-theme', next); } catch (e) {}
    this.applyPalette();
    this.forceUpdate();
  }
  componentDidMount() { this.applyPalette(); }
  componentDidUpdate(prev) {
    if (prev.palette !== this.props.palette) this.applyPalette();
  }
  applyPalette() {
    const P = {
      'Linen': { bg:'#F8F4ED', bg2:'#F1E9DD', card:'#FFFDFA', ink:'#2B3527', soft:'#616D57', accent:'#5D7F45', deep:'#4C6B3C', line:'#E5DCCC', blush:'#C99298' },
      'Dark Matcha': { bg:'#0E1A0A', bg2:'#14240E', card:'#182B11', ink:'#F1F6EA', soft:'#9CB187', accent:'#A9C98C', deep:'#6E9152', line:'#2A4420', blush:'#D18F8F' },
    }[this.themeName()];
    if (!P) return;
    const r = document.documentElement.style;
    Object.entries(P).forEach(([k, v]) => r.setProperty('--m-' + k, v));
  }
  renderVals() {
    const theme = this.themeName();
    return {
      toggleTheme: () => this.toggleTheme(),
      themeIcon: theme === 'Linen' ? '\u263E' : '\u2600',}; }
}
</script>
</body>
</html>
